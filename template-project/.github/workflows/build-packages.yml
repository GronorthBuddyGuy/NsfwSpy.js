# Build and test packages
name: Build Packages

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-browser:
    name: Build Browser Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: browser-package/package-lock.json

      - name: Install dependencies
        working-directory: ./browser-package
        run: npm ci

      - name: Build
        working-directory: ./browser-package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: browser-package-dist
          path: browser-package/dist/

  build-node:
    name: Build Node Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: node-package/package-lock.json

      - name: Install dependencies
        working-directory: ./node-package
        run: npm ci

      - name: Build
        working-directory: ./node-package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: node-package-dist
          path: node-package/dist/
